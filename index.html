<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MØFFI APP</title>
<style>
:root{
  --bg:#faf7f2; --card:#fff; --ink:#2b2320; --sub:#8a7f76; --line:#ece5dc;
  --sleep:#7c93c9; --sleepBg:#eef1fa; --food:#e0956b; --foodBg:#fbf0e8;
  --accent:#2b2320;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1815; --card:#242019; --ink:#f1ebe4; --sub:#a89a8d; --line:#3a332b;
    --sleepBg:#262b3a; --foodBg:#3a2c22;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1815; --card:#242019; --ink:#f1ebe4; --sub:#a89a8d; --line:#3a332b;
  --sleepBg:#262b3a; --foodBg:#3a2c22;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
*{box-sizing:border-box;}
body{
  margin:0; height:100%; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:480px; margin:0 auto; padding:16px 16px 110px;}
h1{font-size:19px; margin:8px 0 14px; letter-spacing:.2px;}
.brand{display:flex; align-items:center; gap:10px; margin:4px 0 16px;}
.brand-name{font-size:20px; font-weight:800; letter-spacing:.5px;}
.tabs{display:flex; gap:8px; margin-bottom:16px;}
.tab{
  flex:1; text-align:center; padding:10px 0; border-radius:12px; border:1px solid var(--line);
  background:var(--card); color:var(--sub); font-size:14px; font-weight:600; cursor:pointer;
}
.tab.active.sleep{background:var(--sleepBg); color:var(--sleep); border-color:var(--sleep);}
.tab.active.food{background:var(--foodBg); color:var(--food); border-color:var(--food);}
.tab.active.stats{background:var(--ink); color:var(--bg); border-color:var(--ink);}
.chart-title{font-size:13px; font-weight:600; margin:4px 0 10px;}
.chart{overflow-x:auto;}
.legend{display:flex; gap:14px; font-size:12px; color:var(--sub); margin-top:6px;}
.legend span{display:inline-flex; align-items:center; gap:5px;}
.legend i{width:8px; height:8px; border-radius:50%; display:inline-block;}
.card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px;}
.big-btn{
  width:100%; padding:16px; border-radius:14px; border:none; font-size:16px; font-weight:700;
  color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
}
.big-btn.sleep{background:var(--sleep);}
.big-btn.food{background:var(--food);}
.big-btn.stop{background:#c96a5a;}
.timer{text-align:center; font-size:13px; color:var(--sub); margin-top:8px;}
.quickrow{display:flex; gap:8px; margin-top:12px;}
.qbtn{
  flex:1; padding:10px 4px; border-radius:10px; border:1px solid var(--line); background:transparent;
  color:var(--ink); font-size:13px; cursor:pointer;
}
.qbtn.sel{border-color:var(--food); background:var(--foodBg); color:var(--food); font-weight:600;}
.field{margin-top:10px;}
.field label{font-size:12px; color:var(--sub); display:block; margin-bottom:4px;}
.field input,.field textarea{
  width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--line);
  background:var(--bg); color:var(--ink); font-size:14px;
}
.save-btn{margin-top:12px; width:100%; padding:11px; border-radius:10px; border:none; background:var(--ink); color:var(--bg); font-weight:600; font-size:14px; cursor:pointer;}
.section-title{font-size:13px; color:var(--sub); margin:18px 0 8px; text-transform:uppercase; letter-spacing:.5px;}
.entry{display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);}
.entry:last-child{border-bottom:none;}
.dot{width:8px; height:8px; border-radius:50%; margin-top:6px; flex-shrink:0;}
.dot.sleep{background:var(--sleep);}
.dot.food{background:var(--food);}
.dot.pyt{background:#d6455a;}
.pyt-bar{
  position:fixed; left:0; right:0; bottom:0; background:var(--bg);
  border-top:1px solid var(--line); padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
  z-index:20;
}
.pyt-inner{max-width:480px; margin:0 auto; text-align:center;}
.pyt-btn{
  width:100%; padding:16px; border:none; border-radius:14px; background:#d6455a; color:#fff;
  font-size:18px; font-weight:800; letter-spacing:1px; cursor:pointer;
}
.pyt-count{font-size:12px; color:var(--sub); margin-top:6px;}
button:disabled{opacity:.45; cursor:not-allowed;}
.entry-main{flex:1; font-size:14px;}
.entry-sub{font-size:12px; color:var(--sub); margin-top:2px;}
.del{background:none; border:none; color:var(--sub); font-size:18px; cursor:pointer; padding:0 4px;}
.empty{text-align:center; color:var(--sub); font-size:13px; padding:20px 0;}
.summary{display:flex; gap:10px; margin-bottom:14px;}
#sinceSummary .stat .n{color:var(--ink);}
#sinceSummary .stat{border-style:dashed;}
.stat{flex:1; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; text-align:center;}
.stat .n{font-size:20px; font-weight:700;}
.stat .l{font-size:11px; color:var(--sub); margin-top:2px;}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <svg width="42" height="42" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <g>
        <!-- petals -->
        <g fill="#f4c430">
          <ellipse cx="50" cy="10" rx="10" ry="16"/>
          <ellipse cx="50" cy="10" rx="10" ry="16" transform="rotate(30 50 50)"/>
          <ellipse cx="50" cy="10" rx="10" ry="16" transform="rotate(60 50 50)"/>
          <ellipse cx="50" cy="10" rx="10" ry="16" transform="rotate(90 50 50)"/>
          <ellipse cx="50" cy="10" rx="10" ry="16" transform="rotate(120 50 50)"/>
          <ellipse cx="50" cy="10" rx="10" ry="16" transform="rotate(150 50 50)"/>
          <ellipse cx="50" cy="10" rx="10" ry="16" transform="rotate(180 50 50)"/>
          <ellipse cx="50" cy="10" rx="10" ry="16" transform="rotate(210 50 50)"/>
          <ellipse cx="50" cy="10" rx="10" ry="16" transform="rotate(240 50 50)"/>
          <ellipse cx="50" cy="10" rx="10" ry="16" transform="rotate(270 50 50)"/>
          <ellipse cx="50" cy="10" rx="10" ry="16" transform="rotate(300 50 50)"/>
          <ellipse cx="50" cy="10" rx="10" ry="16" transform="rotate(330 50 50)"/>
        </g>
        <!-- flower center -->
        <circle cx="50" cy="50" r="26" fill="#7a4a1e"/>
        <!-- pig face peeking out -->
        <ellipse cx="38" cy="42" rx="7" ry="8" fill="#f7b6c2"/>
        <ellipse cx="62" cy="42" rx="7" ry="8" fill="#f7b6c2"/>
        <ellipse cx="38" cy="43" rx="3.4" ry="4" fill="#e8909f"/>
        <ellipse cx="62" cy="43" rx="3.4" ry="4" fill="#e8909f"/>
        <circle cx="50" cy="54" r="20" fill="#fbc4d0"/>
        <circle cx="42" cy="49" r="2.6" fill="#3a2a20"/>
        <circle cx="58" cy="49" r="2.6" fill="#3a2a20"/>
        <ellipse cx="50" cy="60" rx="9" ry="7" fill="#f39fb0"/>
        <ellipse cx="46" cy="60" rx="1.8" ry="2.4" fill="#c76a7f"/>
        <ellipse cx="54" cy="60" rx="1.8" ry="2.4" fill="#c76a7f"/>
      </g>
    </svg>
    <span class="brand-name">MØFFI APP</span>
  </div>

  <div id="syncStatus" style="font-size:11px; color:var(--sub); text-align:center; margin:-8px 0 12px;"></div>
  <div class="summary" id="summary"></div>
  <div class="summary" id="sinceSummary"></div>

  <div class="tabs">
    <div class="tab sleep" id="tabSleep" onclick="setTab('sleep')">😴 Sleep</div>
    <div class="tab food" id="tabFood" onclick="setTab('food')">🍼 Food</div>
    <div class="tab stats" id="tabStats" onclick="setTab('stats')">📊 Stats</div>
  </div>

  <div id="sleepPanel" class="card" style="display:none">
    <button class="big-btn sleep" id="sleepBtn" onclick="toggleSleep()">Start nap</button>
    <div class="timer" id="sleepTimer"></div>
  </div>

  <div id="foodPanel" class="card" style="display:none">
    <div class="quickrow" id="foodTypeRow">
      <button class="qbtn" data-t="Bottle" onclick="selectFoodType('Bottle')">🍼 Bottle</button>
      <button class="qbtn" data-t="Solid" onclick="selectFoodType('Solid')">🥣 Solid</button>
    </div>
    <div class="field"><label>Time</label><input id="foodTime" type="datetime-local"></div>
    <div class="field"><label>Amount (oz/g, optional)</label><input id="foodAmount" type="text" placeholder="e.g. 4oz"></div>
    <div class="field"><label>Note (optional)</label><input id="foodNote" type="text" placeholder="e.g. fussy"></div>
    <button class="save-btn" onclick="logFood()">Log feeding</button>
  </div>

  <div id="statsPanel" style="display:none">
    <div class="card">
      <div class="chart-title">Sleep per day (hours)</div>
      <div class="chart" id="sleepChart"></div>
      <div class="legend"><span><i style="background:var(--sleep)"></i>Total sleep</span></div>
    </div>
    <div class="card">
      <div class="chart-title">Feeds per day</div>
      <div class="chart" id="feedChart"></div>
      <div class="legend"><span><i style="background:var(--food)"></i>Feed count</span></div>
    </div>
    <div class="card">
      <div class="chart-title">Daily breakdown</div>
      <div id="dayTable"></div>
    </div>
  </div>

  <div class="section-title">Recent</div>
  <div class="card" id="history"><div class="empty">Loading…</div></div>
</div>

<div class="pyt-bar">
  <div class="pyt-inner">
    <button class="pyt-btn" onclick="logPyt()">PYT</button>
    <div class="pyt-count" id="pytCount"></div>
  </div>
</div>

<script>
let currentTab='sleep', selectedFoodType='Bottle', sleepStart=null, sleepTimerInt=null;
let entriesCache=[];

function setTab(t){
  currentTab=t;
  document.getElementById('tabSleep').classList.toggle('active',t==='sleep');
  document.getElementById('tabFood').classList.toggle('active',t==='food');
  document.getElementById('tabStats').classList.toggle('active',t==='stats');
  document.getElementById('sleepPanel').style.display = t==='sleep'?'block':'none';
  document.getElementById('foodPanel').style.display = t==='food'?'block':'none';
  document.getElementById('statsPanel').style.display = t==='stats'?'block':'none';
  document.querySelector('.section-title').style.display = t==='stats'?'none':'block';
  document.getElementById('history').style.display = t==='stats'?'none':'block';
  if(t==='stats') renderStats();
}
function selectFoodType(t){
  selectedFoodType=t;
  document.querySelectorAll('#foodTypeRow .qbtn').forEach(b=>b.classList.toggle('sel', b.dataset.t===t));
}
function nowLocalInput(){
  const d=new Date();
  d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
  return d.toISOString().slice(0,16);
}
document.getElementById('foodTime').value = nowLocalInput();

selectFoodType('Bottle');
setTab('sleep');

function fmtTime(iso){
  const d=new Date(iso);
  return d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
}
function fmtDur(ms){
  const m=Math.round(ms/60000);
  if(m<60) return m+'m';
  return Math.floor(m/60)+'h '+(m%60)+'m';
}
function isToday(iso){
  const d=new Date(iso), n=new Date();
  return d.toDateString()===n.toDateString();
}

const firebaseConfig = {
  apiKey: "AIzaSyC38gwVch7CtSrhD5H9xGdKZL0hdnc7Uws",
  authDomain: "moffi-app.firebaseapp.com",
  databaseURL: "https://moffi-app-default-rtdb.firebaseio.com",
  projectId: "moffi-app",
  storageBucket: "moffi-app.firebasestorage.app",
  messagingSenderId: "974558887632",
  appId: "1:974558887632:web:ca4d862f22528db57e68d5"
};
firebase.initializeApp(firebaseConfig);
const fbDb = firebase.database();
const entriesRef = fbDb.ref('entries');

async function init(){
  entriesRef.orderByChild('createdAt').limitToLast(300).on('value', snap=>{
    const arr=[];
    snap.forEach(child=>{ arr.push({id:child.key, ...child.val()}); });
    arr.reverse(); // most recent first
    entriesCache = arr;
    document.getElementById('syncStatus').textContent = '● synced';
    render();
  }, err=>{
    document.getElementById('history').innerHTML='<div class="empty">Could not connect — check your internet connection.</div>';
    document.getElementById('syncStatus').textContent = '○ offline';
  });
}

async function logPyt(){
  try{ await entriesRef.push({type:'pyt', time:new Date().toISOString(), createdAt:Date.now()}); }
  catch(e){ alert('Could not save — check your connection.'); }
}

function renderPytCount(){
  const count = entriesCache.filter(e=>e.type==='pyt' && isToday(e.time)).length;
  document.getElementById('pytCount').textContent = count+' today';
}

function render(){
  renderHistory();
  renderSummary();
  renderSince();
  renderSleepButton();
  renderPytCount();
  if(currentTab==='stats') renderStats();
}

function renderSleepButton(){
  const open = entriesCache.find(e=>e.type==='sleep' && !e.end);
  const btn=document.getElementById('sleepBtn');
  clearInterval(sleepTimerInt);
  if(open){
    sleepStart = open.start;
    btn.textContent='End nap';
    btn.className='big-btn stop';
    const tick=()=>{
      document.getElementById('sleepTimer').textContent='Asleep for '+fmtDur(Date.now()-new Date(sleepStart).getTime());
    };
    tick();
    sleepTimerInt=setInterval(tick,30000);
  } else {
    btn.textContent='Start nap';
    btn.className='big-btn sleep';
    document.getElementById('sleepTimer').textContent='';
  }
}

async function toggleSleep(){
  const open = entriesCache.find(e=>e.type==='sleep' && !e.end);
  try{
    if(open){
      await entriesRef.child(open.id).update({end:new Date().toISOString()});
    } else {
      await entriesRef.push({type:'sleep', start:new Date().toISOString(), end:null, createdAt:Date.now()});
    }
  }catch(e){ alert('Could not save — check your connection.'); }
}

async function logFood(){
  const amount=document.getElementById('foodAmount').value.trim();
  const note=document.getElementById('foodNote').value.trim();
  const timeInput=document.getElementById('foodTime').value;
  const time = timeInput ? new Date(timeInput).toISOString() : new Date().toISOString();
  try{
    await entriesRef.push({
      type:'food', foodType:selectedFoodType, amount, note,
      time, createdAt:Date.now()
    });
    document.getElementById('foodAmount').value='';
    document.getElementById('foodNote').value='';
    document.getElementById('foodTime').value = nowLocalInput();
  }catch(e){ alert('Could not save — check your connection.'); }
}

async function delEntry(id){
  try{ await entriesRef.child(id).remove(); }
  catch(e){ alert('Could not delete — check your connection.'); }
}

function renderHistory(){
  const el=document.getElementById('history');
  if(!entriesCache.length){ el.innerHTML='<div class="empty">No entries yet.</div>'; return; }
  el.innerHTML = entriesCache.slice(0,60).map(e=>{
    let main, sub;
    if(e.type==='sleep'){
      main = e.end ? `Slept ${fmtDur(new Date(e.end)-new Date(e.start))}` : 'Sleeping…';
      sub = fmtTime(e.start) + (e.end? ' – '+fmtTime(e.end):'');
    } else if(e.type==='pyt'){
      main = 'PYT';
      sub = fmtTime(e.time);
    } else {
      main = `${e.foodType||'Feeding'}${e.amount? ' · '+e.amount:''}`;
      sub = fmtTime(e.time) + (e.note? ' · '+e.note:'');
    }
    return `<div class="entry">
      <div class="dot ${e.type}"></div>
      <div class="entry-main">${main}<div class="entry-sub">${sub}</div></div>
      <button class="del" onclick="delEntry('${e.id}')">×</button>
    </div>`;
  }).join('');
}

function renderSummary(){
  const todaySleepMs = entriesCache
    .filter(e=>e.type==='sleep' && e.end && isToday(e.start))
    .reduce((s,e)=>s+(new Date(e.end)-new Date(e.start)),0);
  const todayFeeds = entriesCache.filter(e=>e.type==='food' && isToday(e.time)).length;
  document.getElementById('summary').innerHTML = `
    <div class="stat"><div class="n">${fmtDur(todaySleepMs)||'0m'}</div><div class="l">Sleep today</div></div>
    <div class="stat"><div class="n">${todayFeeds}</div><div class="l">Feeds today</div></div>
  `;
}

function dayKey(iso){ return new Date(iso).toISOString().slice(0,10); }
function dayLabel(key){
  const d=new Date(key+'T12:00:00');
  return d.toLocaleDateString([], {weekday:'short'});
}

function lastNDays(n){
  const days=[];
  const now=new Date();
  for(let i=n-1;i>=0;i--){
    const d=new Date(now); d.setDate(d.getDate()-i);
    days.push(d.toISOString().slice(0,10));
  }
  return days;
}

function barChart(labels, values, color, unitFmt){
  const w=Math.max(320, labels.length*44), h=140, padB=22, padT=14;
  const max = Math.max(1, ...values);
  const bw = (w/labels.length)*0.5;
  let bars='';
  labels.forEach((lab,i)=>{
    const v=values[i];
    const x = (w/labels.length)*i + (w/labels.length-bw)/2;
    const bh = (v/max)*(h-padB-padT);
    const y = h-padB-bh;
    bars += `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(bh,v>0?2:0)}" rx="4" fill="${color}"></rect>`;
    bars += `<text x="${x+bw/2}" y="${h-6}" text-anchor="middle" font-size="10" fill="var(--sub)">${lab}</text>`;
    if(v>0) bars += `<text x="${x+bw/2}" y="${y-4}" text-anchor="middle" font-size="10" fill="var(--ink)">${unitFmt(v)}</text>`;
  });
  return `<svg width="${w}" height="${h}" style="max-width:100%">${bars}</svg>`;
}

function renderStats(){
  const days = lastNDays(7);
  const sleepMsByDay = {}, feedCountByDay = {}, napCountByDay = {};
  days.forEach(d=>{sleepMsByDay[d]=0; feedCountByDay[d]=0; napCountByDay[d]=0;});

  entriesCache.forEach(e=>{
    if(e.type==='sleep' && e.end){
      const k=dayKey(e.start);
      if(k in sleepMsByDay){ sleepMsByDay[k]+= (new Date(e.end)-new Date(e.start)); napCountByDay[k]+=1; }
    } else if(e.type==='food'){
      const k=dayKey(e.time);
      if(k in feedCountByDay) feedCountByDay[k]+=1;
    }
  });

  const labels = days.map(dayLabel);
  const sleepHours = days.map(d=> Math.round((sleepMsByDay[d]/3600000)*10)/10);
  const feedCounts = days.map(d=> feedCountByDay[d]);

  document.getElementById('sleepChart').innerHTML = barChart(labels, sleepHours, 'var(--sleep)', v=>v+'h');
  document.getElementById('feedChart').innerHTML = barChart(labels, feedCounts, 'var(--food)', v=>v);

  const rows = days.slice().reverse().map(d=>{
    const hrs = Math.round((sleepMsByDay[d]/3600000)*10)/10;
    return `<div class="entry">
      <div class="entry-main">${dayLabel(d)}, ${d.slice(5)}
        <div class="entry-sub">${napCountByDay[d]} nap${napCountByDay[d]===1?'':'s'} · ${hrs}h sleep · ${feedCountByDay[d]} feed${feedCountByDay[d]===1?'':'s'}</div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('dayTable').innerHTML = rows;
}

function renderSince(){
  const lastNap = entriesCache.find(e=>e.type==='sleep' && e.end);
  const openNap = entriesCache.find(e=>e.type==='sleep' && !e.end);
  const lastFeed = entriesCache.find(e=>e.type==='food');

  let napText;
  if(openNap) napText = 'Napping now';
  else if(lastNap) napText = fmtDur(Date.now()-new Date(lastNap.end).getTime())+' ago';
  else napText = '—';

  let feedText = lastFeed ? fmtDur(Date.now()-new Date(lastFeed.time).getTime())+' ago' : '—';

  document.getElementById('sinceSummary').innerHTML = `
    <div class="stat"><div class="n">${napText}</div><div class="l">Since last nap</div></div>
    <div class="stat"><div class="n">${feedText}</div><div class="l">Since last feed</div></div>
  `;
}
setInterval(renderSince, 30000);

init();
</script>
</body>
</html>
